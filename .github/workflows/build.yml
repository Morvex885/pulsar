name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Job names "build (aarch64)" / "build (armhf)" are required status checks of the main ruleset.
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armhf]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `git describe` is the version reported to Home Assistant
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1 # 0.13 builds armhf C++ binaries that crash before main
      - run: sudo apt-get update -q && sudo apt-get install -yq ninja-build
      - uses: actions/cache@v6
        with:
          path: satellite/third_party/src
          key: third-party-${{ hashFiles('satellite/third_party/fetch.sh', 'satellite/third_party/sysroot.sh') }}
      - name: daemon + tools
        working-directory: satellite
        run: |
          tools=$(for t in tools/*.cpp; do t=${t#tools/}; printf 'build/%s/tools/%s ' "${{ matrix.arch }}" "${t%.cpp}"; done)
          make ARCH=${{ matrix.arch }} -j"$(nproc)" binary $tools
      - uses: actions/upload-artifact@v7
        with:
          name: pulsar-${{ matrix.arch }}
          path: |
            satellite/build/${{ matrix.arch }}/pulsar
            satellite/build/${{ matrix.arch }}/pulsar.debug
          if-no-files-found: error

  radio:
    # Zigbee firmware (router, coordinator) for the Midi's radio (Telink B91), installed next to the daemon.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: i386 C library (the Telink toolchain is 32-bit x86)
        run: sudo dpkg --add-architecture i386 && sudo apt-get update -q && sudo apt-get install -yq libc6:i386
      - uses: actions/cache@v6
        with:
          path: |
            radio/src
            radio/toolchain
          key: radio-${{ hashFiles('radio/build.sh', 'radio/sdk.patch') }}
      - run: radio/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: radio
          path: |
            radio/out/zigbee-router.ybl
            radio/out/zigbee-coordinator.ybl
          if-no-files-found: error

  ssh:
    # dropbear + sftp-server for the release archives (pulsar-install --ssh); tags only.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: ssh/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ssh
          path: |
            ssh/out/aarch64/
            ssh/out/armhf/
          if-no-files-found: error

  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: installer/go.sum
      - name: vet + test
        working-directory: installer
        run: |
          go vet ./... && GOOS=windows go vet ./... && GOOS=darwin go vet ./...
          go test ./...
      - name: cross-build
        working-directory: installer
        run: |
          for t in windows/amd64 darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${t%/*} arch=${t#*/} ext=
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "dist/$os-$arch/pulsar-install$ext" .
          done
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: installer/dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, ssh, radio, installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: 'GitHub release: archives per host OS, both binaries, debug files'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Artifact roots: satellite/build/<arch>/, ssh/out/ and radio/out/.
          mkdir -p radio/out
          cp artifacts/radio/zigbee-*.ybl radio/out/
          # Constant names: the daemon's updater downloads releases/download/<tag>/zigbee-*.ybl.
          cp artifacts/radio/zigbee-*.ybl .
          for a in aarch64 armhf; do
            mkdir -p satellite/build/$a ssh/out/$a
            cp artifacts/pulsar-$a/pulsar satellite/build/$a/pulsar
            cp artifacts/ssh/$a/dropbearmulti artifacts/ssh/$a/sftp-server ssh/out/$a/
            cp artifacts/pulsar-$a/pulsar pulsar-$a.bin
            cp artifacts/pulsar-$a/pulsar.debug pulsar-$a.debug
          done
          # Constant names: README links releases/latest/download/pulsar-<os>-<arch>.<ext>.
          satellite/deploy/dist.sh pulsar-windows-amd64.zip artifacts/installer/windows-amd64/pulsar-install.exe
          for t in macos-arm64:darwin-arm64 macos-amd64:darwin-amd64 linux-amd64:linux-amd64 linux-arm64:linux-arm64; do
            satellite/deploy/dist.sh "pulsar-${t%%:*}.tar.gz" "artifacts/installer/${t#*:}/pulsar-install"
          done
          sha256sum pulsar-*.bin zigbee-*.ybl pulsar-*.zip pulsar-*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            pulsar-*.bin pulsar-*.debug zigbee-*.ybl pulsar-*.zip pulsar-*.tar.gz SHA256SUMS
