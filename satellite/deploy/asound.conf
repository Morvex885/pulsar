# Mini: dmix over hw:0,0 so GStreamer's two channels and Sendspin can share the speaker.
# Selected through ALSA_CONFIG_PATH by the daemon (Model::apply_env) when this file exists;
# includes the firmware's normal config first so hw:, ctl. and /etc/asound.conf definitions keep
# working.
<confdir:alsa.conf>

pcm.minidmix {
    type dmix
    ipc_key 2277
    slave {
        pcm "hw:0,0"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
    bindings {
        0 0
        1 1
    }
}

pcm.mini {
    type plug
    slave.pcm "minidmix"
}
